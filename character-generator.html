<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>바자르 SD 유닛 생성기</title>
  <link rel="stylesheet" href="character-generator.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">BAZAAR UNIT LAB</p>
        <h1>SD 유닛 생성기</h1>
        <p>설정만 고르면 게임용 상태 이미지를 한 번에 만듭니다.</p>
      </div>
      <div id="apiStatus" class="status-pill">서버 확인 중</div>
    </header>

    <section class="workspace">
      <form id="generatorForm" class="panel controls">
        <div class="section-title">
          <span>01</span><h2>유닛 설정</h2>
        </div>

        <div class="segmented" role="group" aria-label="유닛 종류">
          <button type="button" class="mode active" data-mode="character">캐릭터</button>
          <button type="button" class="mode" data-mode="monster">몬스터</button>
          <button type="button" class="mode" data-mode="boss">보스</button>
        </div>

        <div class="field-grid">
          <label>이름
            <input id="unitName" value="번개 마법사" maxlength="40">
          </label>
          <label>종족 / 직업
            <input id="archetype" value="노련한 인간 마법사" maxlength="80">
          </label>
        </div>

        <label>핵심 특징 — 3개 이하 권장
          <textarea id="features" rows="3">커다란 청록색 모자, 흰 눈썹과 수염, 파란 번개</textarea>
        </label>

        <div class="field-grid">
          <label>주 색상
            <input id="palette" value="청록, 남색, 아이보리, 주황" maxlength="80">
          </label>
          <label>출력 크기
            <select id="targetSize">
              <option value="128">128 × 128</option>
              <option value="64">64 × 64</option>
            </select>
          </label>
        </div>

        <label>추가 요청
          <textarea id="extra" rows="2" placeholder="예: 지팡이는 짧고 굵게, 표정은 심술궂게"></textarea>
        </label>

        <div class="upload-box" id="uploadBox">
          <input id="referenceInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
          <img id="referencePreview" alt="참고 이미지 미리보기">
          <div id="uploadCopy">
            <strong>참고 이미지</strong>
            <span>클릭하거나 이미지를 끌어놓으세요 · 선택 사항</span>
          </div>
          <button id="removeReference" type="button" aria-label="참고 이미지 제거">×</button>
        </div>

        <details class="api-key-box">
          <summary>API 키 설정</summary>
          <label>OpenAI API key
            <input id="apiKey" type="password" autocomplete="off" placeholder="환경변수가 없을 때만 입력">
          </label>
          <small>키는 저장되지 않으며 이 로컬 서버 요청에만 사용됩니다.</small>
        </details>

        <div class="actions">
          <button id="promptButton" class="secondary" type="button">프롬프트 확인</button>
          <button id="generateButton" class="primary" type="submit">전체 상태 생성</button>
          <button id="cancelButton" class="cancel" type="button" hidden>생성 취소</button>
        </div>
      </form>

      <section class="panel results">
        <div class="results-head">
          <div class="section-title"><span>02</span><h2>상태 이미지</h2></div>
          <p id="stateGuide">캐릭터는 아이들·공격 2개 상태로 생성됩니다.</p>
        </div>
        <div id="resultGrid" class="result-grid"></div>
        <div id="emptyState" class="empty-state">
          <div class="tiny-unit">✦</div>
          <strong>아직 생성된 이미지가 없습니다</strong>
          <span>왼쪽에서 특징을 정하고 전체 상태 생성을 누르세요.</span>
        </div>
      </section>
    </section>
  </main>

  <dialog id="promptDialog">
    <div class="dialog-head"><h2>생성 프롬프트</h2><button id="closeDialog" type="button">×</button></div>
    <pre id="promptPreview"></pre>
    <button id="copyPrompt" class="primary" type="button">복사</button>
  </dialog>

  <script src="character-generator.js"></script>
</body>
</html>
